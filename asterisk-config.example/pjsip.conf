;
; MKB Dialer — PJSIP configuration
;
; Telnyx *Credential* SIP Connection. Outbound authenticates with digest
; auth; no registration is required for outbound-only, but we register to
; keep a NAT pinhole open.
;
; Agents come in two flavours:
;   1001-1006  browser phones  (WebRTC over WebSocket) — the product path
;   2001-2006  desk softphones (plain UDP)             — fallback / testing
;
; NOTE: contains live SIP credentials. This directory is deliberately not a
; git repository. Canonical values live in mkb-dialer-backend/.env.
;

[global]
type=global
user_agent=MKB-Dialer
endpoint_identifier_order=ip,username,anonymous

; ---------------------------------------------------------------------
; TRANSPORTS
; ---------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WebRTC signalling. The bind address here is ignored: ws/wss are served by
; Asterisk's built-in HTTP server (http.conf, port 8088) at /ws.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------------------------------------------------------------------
; TELNYX TRUNK
; ---------------------------------------------------------------------
[telnyx-trunk]
type=endpoint
; sip.telnyx.com SRV-resolves to two anycast POPs and PJSIP round-robins
; between them. sip-anycast2 (64.16.250.10) accepts our packets but never
; answers an INVITE, so roughly half of all calls died in silence with no SIP
; response at all. Pin signalling to anycast1, which answers.
outbound_proxy=sip:sip-anycast1.telnyx.com;lr
context=from-telnyx
transport=transport-udp
disallow=all
allow=ulaw,alaw,g722
outbound_auth=telnyx-auth
aors=telnyx-aor
; Telnyx rejects calls whose From user is not a number on the account.
from_user=YOUR_TELNYX_NUMBER
from_domain=sip.telnyx.com
callerid=MKB Dialer <YOUR_TELNYX_NUMBER>
; Required behind Docker/NAT so media returns to the mapped port.
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
dtmf_mode=rfc4733

[telnyx-auth]
type=auth
auth_type=userpass
username=YOUR_TELNYX_SIP_USERNAME
password=YOUR_TELNYX_SIP_PASSWORD

[telnyx-aor]
type=aor
contact=sip:sip.telnyx.com:5060
qualify_frequency=60

[telnyx-identify]
type=identify
endpoint=telnyx-trunk
match=sip.telnyx.com

[telnyx-registration]
type=registration
transport=transport-udp
outbound_auth=telnyx-auth
server_uri=sip:sip.telnyx.com
client_uri=sip:YOUR_TELNYX_SIP_USERNAME@sip.telnyx.com
retry_interval=60
forbidden_retry_interval=600
expiration=600

; ---------------------------------------------------------------------
; TEMPLATES
; ---------------------------------------------------------------------

; Browser agent. webrtc=yes expands to the whole WebRTC bundle: AVPF,
; DTLS-SRTP with an auto-generated cert, ICE, rtcp-mux, and using the
; received transport for media.
[agent-webrtc](!)
type=endpoint
context=from-internal
disallow=all
; ulaw only, deliberately. This Asterisk build has res_format_attr_opus but
; NOT codec_opus, so it can negotiate Opus and then fail to transcode it to
; the trunk's ulaw — which presents as a connected call with dead audio.
; PSTN is ulaw end to end anyway, so this also removes a transcode hop.
; If you ever add codec_opus.so, you can put opus back in front.
allow=ulaw,alaw
webrtc=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Desk softphone (Zoiper / Linphone / MicroSIP) over plain UDP.
[agent-udp](!)
type=endpoint
context=from-internal
transport=transport-udp
disallow=all
allow=ulaw,alaw,g722
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes

; Browser agents: no qualify. Asterisk's OPTIONS ping goes unanswered
; (SIP.js cannot parse the From header Asterisk sends), so the contact gets
; marked Unreachable and calls stop routing to that agent. The websocket
; closing already tells Asterisk the browser is gone, so qualify adds nothing.
[agent-aor-ws](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=0

; Desk phones over UDP have no such signal, so keep qualifying them.
[agent-aor-udp](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; ---------------------------------------------------------------------
; BROWSER AGENTS 1001-1006  (used by the Agent Station page)
; ---------------------------------------------------------------------

[1001](agent-webrtc)
auth=1001-auth
aors=1001
[1001-auth]
type=auth
auth_type=userpass
username=1001
password=CHANGE_ME_agent1001
[1001](agent-aor-ws)

