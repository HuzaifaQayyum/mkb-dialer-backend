;
; MKB Dialer — dialplan
;
; Bulk dialing does NOT run through this dialplan. The pacing engine
; originates leads straight into the Stasis app "mkb-dialer" over ARI,
; and mkb-dialer-core bridges the answered lead to a free agent.
; What follows covers manual dialing and inbound.
;

[general]
static=yes
writeprotect=no

[globals]
TRUNK=PJSIP/telnyx-trunk
TRUNK_HOST=sip.telnyx.com

; ---------------------------------------------------------------------
; Agent-initiated calls (softphone registered as 1001-1006)
; ---------------------------------------------------------------------
[from-internal]
; Agent-to-agent
exten => _100X,1,NoOp(Internal call to agent ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Echo test — lets an agent verify their mic/speaker path end to end.
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Outbound PSTN. Normalise to E.164 before handing to Telnyx:
; 10 digits -> +1XXXXXXXXXX, 11 digits starting with 1 -> +1XXXXXXXXXX.
exten => _NXXNXXXXXX,1,Goto(from-internal,+1${EXTEN},1)
exten => _1NXXNXXXXXX,1,Goto(from-internal,+${EXTEN},1)
exten => _+X.,1,NoOp(Outbound ${EXTEN} via Telnyx)
 same => n,Set(CALLERID(num)=YOUR_TELNYX_NUMBER)
 same => n,Dial(${TRUNK}/sip:${EXTEN}@${TRUNK_HOST},45)
 same => n,Hangup()

; ---------------------------------------------------------------------
; Inbound from Telnyx
; ---------------------------------------------------------------------
[from-telnyx]
exten => _X.,1,NoOp(Inbound from Telnyx to ${EXTEN} / from ${CALLERID(num)})
 same => n,Answer()
 same => n,Dial(PJSIP/1001&PJSIP/1002&PJSIP/1003,30)
 same => n,Hangup()

exten => _+X.,1,Goto(from-telnyx,${EXTEN:1},1)

; ---------------------------------------------------------------------
; Bulk dialer — handed to ARI. Kept as a fallback so an originate that
; loses its Stasis app still lands somewhere defined rather than failing.
; ---------------------------------------------------------------------
[bulk-outbound]
exten => s,1,NoOp(Bulk lead answered — handing to Stasis)
 same => n,Stasis(mkb-dialer)
 same => n,Hangup()

exten => _X.,1,Goto(bulk-outbound,s,1)
